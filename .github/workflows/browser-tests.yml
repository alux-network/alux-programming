name: 📚 Extended browser tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reuse the development image's pinned Node, mdBook tools and Playwright engines.
      - name: Build browser test environment
        run: docker build --tag alux-browser-tests .devcontainer

      - name: Build the site and run extended browser tests
        run: |
          docker run --rm --ipc=host \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            alux-browser-tests \
            bash -lc 'npm ci && npm run check && npm run build && npm run test:browser'
