nnen."},"es":{"text":"Te damos la bienvenida a ALUX Programming. Primero define el significado y luego crea un mundo. Elige tu camino. Empecemos."},"ru":{"text":"Добро пожаловать в ALUX Programming. Сначала определите смысл, затем создайте мир. Выберите свой путь — и начнём."},"uk":{"text":"Ласкаво просимо до ALUX Programming. Спершу визначте значення, а потім створіть світ. Оберіть свій шлях — і почнімо."},"ar":{"text":"مرحبا بك في ALUX Programming. حدّد المعنى أولا، ثم ابتكر عالما. اختر طريقك، ولنبدأ من هنا."}};const select=document.querySelector('select');function render(){const code=select.value;const audio=document.querySelector('audio');audio.pause();audio.src='../public/audio/welcome/'+code+'.mp3';const welcome=document.getElementById('welcome-text');welcome.textContent=voices[code].text;welcome.lang=code;welcome.dir=code==='ar'?'rtl':'ltr';for(const image of document.querySelectorAll('.panels img'))image.src='../public/social/alux-programming-'+code+'.jpg';document.querySelectorAll('.title').forEach(el=>el.textContent='ALUX Programming');document.querySelectorAll('.desc').forEach(el=>{el.textContent=data[code].description;el.dir=code==='ar'?'rtl':'ltr';el.lang=code;});document.querySelectorAll('a').forEach(a=>a.href='http://127.0.0.1:4174/'+(code==='en'?'':code+'/')+(a.dataset.route||''));}select.onchange=render;select.value='zh';render();</script></body></html>
